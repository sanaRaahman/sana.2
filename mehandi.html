<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. SEO Title और Meta Tags -->
    <title>Beautiful Mehandi Design Gallery | Apnaapan Hai Tumse - Sana</title>
    <meta name="description" content="Explore simple, back hand, jali pattern and front hand mehandi designs collection by Sana. Perfect bridal and festive henna art inspiration.">
    <meta name="keywords" content="mehandi design, front hand mehandi, jali pattern mehandi, simple mehandi, henna art, apnaapan hai tumse, sana mehandi, short video mehandi">

    <style>
        body {
            background-color: #f4f4f4;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .mehandi-header {
            background-color: #232f3e;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* मुख्य गैलरी डिब्बा */
        .mehandi-grid-box {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-align: center;
        }

        /* मुख्य बड़ी इमेज दिखाने का एरिया */
        .preview-box img {
            width: 100%;
            height: 280px;
            object-fit: contain;
            background-color: #ffffff; 
            border-radius: 8px;
            border: 2px solid #ff9900;
            transition: 0.3s ease;
        }

        .preview-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin: 10px 0;
        }

        /* सेव/डाउनलोड बटन का डिज़ाइन */
        .save-mehandi-btn {
            display: inline-block;
            background-color: #232f3e;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: 0.2s;
        }

        .save-mehandi-btn:hover {
            background-color: #ff9900;
        }

        /* छोटी तस्वीरों की ग्रिड (3-3 के जोड़े में) */
        .thumbnails-6 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .thumbnails-6 img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid #ddd;
            transition: 0.2s;
            background-color: #ffffff;
        }

        .thumbnails-6 img:hover {
            border-color: #ff9900;
            transform: scale(1.05);
        }

        .back-home {
            text-align: center;
            margin: 25px 0;
        }

        .back-home a {
            display: inline-block;
            background-color: #ff9900;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ऊपर का हेडर -->
    <div class="mehandi-header">
        <span style="font-size: 18px; font-weight: bold;">🎨 Apnaapan Hai Tumse</span>
        <a href="index.html" style="color: white; text-decoration: none; font-size: 14px;">🏠 Home</a>
    </div>

    <h2 style="text-align: center; color: #232f3e; margin-top: 20px;">Sana's Mehandi Collection</h2>

    <!-- मुख्य डिब्बा जिसमें एक बड़ी फोटो, टाइटल और सेव बटन होगा -->
    <div class="mehandi-grid-box">
        
        <!-- मुख्य बड़ी तस्वीर (डिफ़ॉल्ट में पहली डिज़ाइन) -->
        <div class="preview-box">
            <img id="activeMehandi" src="Mehandi/Dulhan design.jpg" alt="Dulhan Design" width="600" height="280">
            <div class="preview-title" id="activeTitle">Dulhan Design</div>
        </div>

        <!-- सेव/डाउनलोड बटन -->
        <div style="margin: 15px 0;">
            <a id="saveBtn" href="Mehandi/Dulhan design.jpg" download class="save-mehandi-btn">
                📥 Save Mehandi Design
            </a>
        </div>

        <p style="font-size: 13px; color: #666; margin-top: 15px;">नीचे दी गई डिज़ाइनों में से किसी पर भी क्लिक करें:</p>

        <!-- सभी नई मेहंदी इमेजेस की ग्रिड (Lazy Loading के साथ) -->
        <div class="thumbnails-6">
            <img src="Mehandi/Dulhan design.jpg" alt="Dulhan Design" loading="lazy" onclick="showBigImage(this, 'Dulhan Design')">
            <img src="Mehandi/back Mandela design.jpg" alt="Back Mandela Design" loading="lazy" onclick="showBigImage(this, 'Back Mandela Design')">
            <img src="Mehandi/back design.jpg" alt="Back Design" loading="lazy" onclick="showBigImage(this, 'Back Design')">
            <img src="Mehandi/back mehndi 1.jpg" alt="Back Mehndi 1" loading="lazy" onclick="showBigImage(this, 'Back Mehndi 1')">
            <img src="Mehandi/back mehndi design 2.jpg" alt="Back Mehndi Design 2" loading="lazy" onclick="showBigImage(this, 'Back Mehndi Design 2')">
            <img src="Mehandi/back mehndi design.jpg" alt="Back Mehndi Design" loading="lazy" onclick="showBigImage(this, 'Back Mehndi Design')">
            <img src="Mehandi/back mehndi design3.jpg" alt="Back Mehndi Design 3" loading="lazy" onclick="showBigImage(this, 'Back Mehndi Design 3')">
            <img src="Mehandi/back simple design.jpg" alt="Back Simple Design" loading="lazy" onclick="showBigImage(this, 'Back Simple Design')">
            <img src="Mehandi/backhand mehandi 1.jpg" alt="Backhand Mehndi 1" loading="lazy" onclick="showBigImage(this, 'Backhand Mehndi 1')">
            <img src="Mehandi/backhand mehandi 2.jpg" alt="Backhand Mehndi 2" loading="lazy" onclick="showBigImage(this, 'Backhand Mehndi 2')">
            <img src="Mehandi/backhand mehandi 3.jpg" alt="Backhand Mehndi 3" loading="lazy" onclick="showBigImage(this, 'Backhand Mehndi 3')">
            <img src="Mehandi/backhand mehandi 4.jpg" alt="Backhand Mehndi 4" loading="lazy" onclick="showBigImage(this, 'Backhand Mehndi 4')">
            <img src="Mehandi/backhand mehandi 6.jpg" alt="Backhand Mehndi 6" loading="lazy" onclick="showBigImage(this, 'Backhand Mehndi 6')">
            <img src="Mehandi/easy mehandi design.jpg" alt="Easy Mehndi Design" loading="lazy" onclick="showBigImage(this, 'Easy Mehndi Design')">
            <img src="Mehandi/flowers mehndi design 2....jpg" alt="Flowers Mehndi Design 2" loading="lazy" onclick="showBigImage(this, 'Flowers Mehndi Design 2')">
            <img src="Mehandi/flowers mehndi design1....jpg" alt="Flowers Mehndi Design 1" loading="lazy" onclick="showBigImage(this, 'Flowers Mehndi Design 1')">
            <img src="Mehandi/mehandi7.jpg" alt="Mehndi 7" loading="lazy" onclick="showBigImage(this, 'Mehndi 7')">
            <img src="Mehandi/mehndi design.jpg" alt="Mehndi Design" loading="lazy" onclick="showBigImage(this, 'Mehndi Design')">
            <img src="Mehandi/new Mandela design.jpg" alt="New Mandela Design" loading="lazy" onclick="showBigImage(this, 'New Mandela Design')">
            <img src="Mehandi/pair ki design.jpg" alt="Pair Ki Design" loading="lazy" onclick="showBigImage(this, 'Pair Ki Design')">
            <img src="Mehandi/simple back hand design....jpg" alt="Simple Back Hand Design" loading="lazy" onclick="showBigImage(this, 'Simple Back Hand Design')">
            <img src="Mehandi/simple back hand simple....jpg" alt="Simple Back Hand Simple" loading="lazy" onclick="showBigImage(this, 'Simple Back Hand Simple')">
            <img src="Mehandi/simple design back.jpg" alt="Simple Design Back" loading="lazy" onclick="showBigImage(this, 'Simple Design Back')">
            <img src="Mehandi/simple design1.jpg" alt="Simple Design 1" loading="lazy" onclick="showBigImage(this, 'Simple Design 1')">
            <img src="Mehandi/simple pair ke design.jpg" alt="Simple Pair Ke Design" loading="lazy" onclick="showBigImage(this, 'Simple Pair Ke Design')">
            <img src="Mehandi/simple pair ki design 1.jpg" alt="Simple Pair Ki Design 1" loading="lazy" onclick="showBigImage(this, 'Simple Pair Ki Design 1')">
            <img src="Mehandi/simple pair ki design.jpg" alt="Simple Pair Ki Design" loading="lazy" onclick="showBigImage(this, 'Simple Pair Ki Design')">
        </div>

    </div>

    <!-- होम पेज पर लौटने का बटन -->
    <div class="back-home">
        <a href="index.html">← Go Back to Home</a>
    </div>

    <!-- जावास्क्रिप्ट -->
    <script>
        function showBigImage(element, titleText) {
            var bigImg = document.getElementById("activeMehandi");
            var titleBox = document.getElementById("activeTitle");
            var saveButton = document.getElementById("saveBtn");
            
            bigImg.src = element.src;
            titleBox.innerText = titleText;
            saveButton.href = element.src;
        }
    </script>
    
</body>
</html>
